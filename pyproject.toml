[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labjury"
version = "0.0.1"
description = "LabJury — a plugin-driven, async decision engine for labeling and moderation (proposers plead, a scorer judges, a verdict is rendered)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "nhuhoan" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
redis = ["redis>=5"]

[project.urls]
Homepage = "https://github.com/nhuhoan/labjury"

# Plugin contract: third parties register plugins under these seven groups
# (one per plugin kind) without any change to the core. load_entry_points()
# discovers them. Groups are declared here as the documented contract; the
# core ships no built-in entry points.
[project.entry-points."labjury.context_builders"]
[project.entry-points."labjury.proposers"]
[project.entry-points."labjury.scorers"]
[project.entry-points."labjury.policies"]
[project.entry-points."labjury.sinks"]
[project.entry-points."labjury.taxonomies"]
[project.entry-points."labjury.caches"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
